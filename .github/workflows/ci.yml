name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: goodnasubi/sigil
          ref: 947815bfa367354dec99bd6308b8931949dec49c
          path: sigil-compiler
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: goodnasubi/sigil-db
          ref: 9483e36f08c35bfc62b3beeb008a531887506037
          path: sigil-db-core
          persist-credentials: false

      - name: Verify the pinned compiler and core
        run: |
          . deps/pins.env
          test "$(git -C sigil-compiler rev-parse HEAD)" = "$SIGIL_COMPILER_SHA"
          test "$(git -C sigil-db-core rev-parse HEAD)" = "$SIGIL_DB_CORE_SHA"
          echo "compiler $SIGIL_COMPILER_SHA"
          echo "core     $SIGIL_DB_CORE_SHA"

      - name: Build Sigil
        run: cargo build --release --locked --manifest-path sigil-compiler/Cargo.toml --target-dir "$RUNNER_TEMP/sigil-target"

      - name: Test (Sigil evaluator and native)
        run: SIGIL="$RUNNER_TEMP/sigil-target/release/sigil" SIGIL_DB_CORE="$GITHUB_WORKSPACE/sigil-db-core" cargo test --locked
