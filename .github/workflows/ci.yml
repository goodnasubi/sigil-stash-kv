name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: goodnasubi/sigil
          ref: 947815bfa367354dec99bd6308b8931949dec49c
          path: sigil-compiler
          persist-credentials: false

      - name: Build Sigil
        run: cargo build --locked --manifest-path sigil-compiler/Cargo.toml --target-dir "$RUNNER_TEMP/sigil-target"

      - name: Test (Sigil evaluator and native)
        run: SIGIL="$RUNNER_TEMP/sigil-target/debug/sigil" cargo test --locked
